[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netease-lyric-api"
dynamic = ["version"]
description = "网易云音乐实时播放状态/歌曲信息/歌词 API + 可选桌面悬浮歌词窗 (Windows)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DSH" }]
keywords = ["netease", "cloudmusic", "lyrics", "now-playing", "album", "cover",
            "obs", "desktop-lyrics", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/maker114/netease-lyric-api"
Repository = "https://github.com/maker114/netease-lyric-api"
Issues = "https://github.com/maker114/netease-lyric-api/issues"
Documentation = "https://github.com/maker114/netease-lyric-api#readme"
Changelog = "https://github.com/maker114/netease-lyric-api/releases"

[project.optional-dependencies]
dev = ["build", "pytest"]
overlay = ["Pillow>=9.0"]

[project.scripts]
netease-lyric = "netease_lyric.cli:main"
netease-lyric-overlay = "netease_lyric.overlay:main"

[tool.setuptools]
packages = ["netease_lyric"]

[tool.setuptools.dynamic]
version = { attr = "netease_lyric._version.__version__" }
