[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netease-lyric-api"
dynamic = ["version"]
description = "网易云音乐实时播放状态/歌词 API + 可选桌面悬浮歌词窗 (Windows)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DSH" }]
keywords = ["netease", "cloudmusic", "lyrics", "now-playing", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
dev = ["build", "pytest"]

[project.scripts]
netease-lyric = "netease_lyric.cli:main"
netease-lyric-overlay = "netease_lyric.overlay:main"

[tool.setuptools]
packages = ["netease_lyric"]

[tool.setuptools.dynamic]
version = { attr = "netease_lyric._version.__version__" }
